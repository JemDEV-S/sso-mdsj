services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sso_mdsj
      POSTGRES_USER: sso_mdsj
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en sso/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - sso_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_mdsj -d sso_mdsj"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sso_postgres:
